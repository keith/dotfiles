[alacritty]
alt.backspace = A-backspace
# Let Alacritty handle these as Command shortcuts so the matching Ctrl keys
# still reach terminal programs unchanged.
mac.c = M-c
mac.x = M-x
mac.v = M-v

# Pass through to hyprland for new window
mac.n = M-n
# Intentional Alacritty-specific behavior.
mac.t = M-t
mac.w = M-w

[com-mitchellh-ghostty]
alt.backspace = A-backspace
# Ghostty's Linux shortcuts; keep plain Ctrl keys available to terminal programs.
mac.c = C-S-c
mac.v = C-S-v
# Ghostty has no cut action; avoid sending Ctrl-X to terminal programs.
mac.x = M-x

# Pass through to hyprland for new window
mac.n = M-n
# New tab and close tab.
mac.t = C-S-t
mac.w = C-S-w

[google-chrome]
# Find next/previous match in the page.
mac.g = C-g
shift+mac.g = C-S-g

# Select tabs by number; 9 selects the last tab.
mac.1 = C-1
mac.2 = C-2
mac.3 = C-3
mac.4 = C-4
mac.5 = C-5
mac.6 = C-6
mac.7 = C-7
mac.8 = C-8
mac.9 = C-9

# Chrome on Linux has no Settings shortcut; open its Settings page.
mac.comma = macro(C-t 100ms chrome://settings enter)

# Zoom in/out and reset, including Command-Shift-Plus.
mac.equal = C-equal
shift+mac.equal = C-S-equal
mac.minus = C-minus
mac.0 = C-0

# Chrome/Linux equivalents for macOS browser history shortcuts.
mac.leftbrace = A-left
mac.rightbrace = A-right

# Chrome/Linux equivalents for macOS tab switching shortcuts.
shift+mac.leftbrace = C-S-tab
shift+mac.rightbrace = C-tab

[com-onepassword-onepassword]
# Open settings with Command-comma.
mac.comma = C-comma
